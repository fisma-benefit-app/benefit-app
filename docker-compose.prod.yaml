# Production-style stack for a self-hosted server (e.g. UpCloud).
#   docker compose -f docker-compose.prod.yaml up -d --build
# Unlike docker-compose.yaml (local dev), this runs the images as built: no
# command overrides, no source bind mounts, and the default profile, which
# never creates the schema or seeds data. Values come from the root .env.
#
# The browser only talks to the frontend's nginx on port 80, which forwards
# /api/ to the backend. The backend and database ports are bound to localhost,
# so the server's firewall only needs port 80 (plus SSH).
#
# WARNING: everything is served over plain HTTP. Login sends the username and
# password (HTTP Basic) and every API call carries a JWT, so both cross the
# network unencrypted. Before real users log in on a public server, put a TLS
# reverse proxy (e.g. Caddy) in front of port 80 and set CORS_ALLOWED_ORIGINS
# to its https:// address.

name: fisma-prod

services:
  db:
    image: postgres:16-alpine
    container_name: fisma_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Bound to localhost only: Docker-published ports bypass ufw, so a plain
    # "5433:5432" would expose the database to the internet.
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: fisma_prod_backend
    restart: unless-stopped
    environment:
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env (from the backend-credentials repo)}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Where the browser opens the frontend, e.g. http://<server-ip>. Without it
      # the backend only accepts the GitHub Pages and localhost:5173 origins.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env to the frontend's public origin, e.g. http://<server-ip>}
      API_DEBUG: never
      API_DEBUG_LEVEL: info
    # Localhost only, for health checks on the server. Browsers reach the API
    # through the frontend's nginx at /api/.
    ports:
      - "127.0.0.1:${HOST_BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: fisma_prod_frontend
    restart: unless-stopped
    environment:
      # Where nginx forwards /api/ to. Only change it when the backend runs
      # outside Compose (see the deployment guide's fallback).
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
