name: Publish production frontend

# Deploy the backend manually in Scalingo first, then copy the SHA from
# the successful benefit deployment here.
on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: Full commit SHA from the successful production Scalingo deployment
        required: true
        type: string

permissions: {}

concurrency:
  group: benefit-production-pages

jobs:
  publish:
    name: Publish and verify production Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The workflow runs from main. A release can use an earlier commit if
      # main advanced after the manual backend deployment.
      - name: Check out the deployed backend revision
        id: release
        env:
          BACKEND_SHA: ${{ inputs.backend_sha }}
        run: |
          if [[ ! "$BACKEND_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Enter the full 40-character commit SHA from Scalingo.'
            exit 1
          fi
          release_sha="${BACKEND_SHA,,}"
          if [[ "$(git cat-file -t "$release_sha" 2>/dev/null)" != commit ]] ||
             ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo 'The supplied SHA must identify a commit in the history of main.'
            exit 1
          fi
          git checkout --detach "$release_sha"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # PRODUCTION_URL is the public API origin under Settings → Secrets and
      # variables → Actions → Variables. Vite embeds it and the Pages base path.
      - name: Build the matching production frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_URL }}
          VITE_BASE_PATH: /benefit-app/
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          npm run build:production
          # Record the deployed commit even if the run started from newer main.
          GITHUB_SHA="$RELEASE_SHA" npm run write:version
          jq -e --arg sha "$RELEASE_SHA" '.sha == $sha' dist/version.json

      # GitHub supplies GITHUB_TOKEN for the gh-pages branch push.
      - name: Configure Git for publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://$GITHUB_ACTOR:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"

      # Publish the verified dist directory without rebuilding via predeploy.
      - name: Publish the matching frontend to production Pages
        working-directory: frontend
        run: npm --ignore-scripts run deploy:production

      - name: Confirm Pages serves the selected commit
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          for attempt in {1..60}; do
            sha=$(curl --fail --silent --max-time 5 \
              "https://fisma-benefit-app.github.io/benefit-app/version.json?cb=$(date +%s)" |
              jq -r '.sha' || true)
            if [[ "$sha" == "$RELEASE_SHA" ]]; then
              echo "Production Pages serves $RELEASE_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "Production Pages did not publish $RELEASE_SHA. Check the Pages build before retrying."
          exit 1
