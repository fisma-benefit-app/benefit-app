name: Run deployments

# Run manually on main after the Scalingo production backend is deployed.
# The legacy Heroku production integration can also trigger a Pages publish.
on:
  deployment_status:
  workflow_dispatch: 

permissions: {}

jobs:
  # Reports a successful Heroku production deployment. The backend is
  # deployed by the provider before GitHub receives this event.
  deploy-backend-to-production-environment:
    name: Deploy BE to production environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'fisma-benefit-app' &&
      github.event.deployment_status.state == 'success'

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Echo Heroku automatic deployment
        run: echo "Backend is deployed automatically in Heroku"

  deploy-frontend-to-production-environment:
    name: Deploy FE to production environment
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.environment == 'fisma-benefit-app' &&
       github.event.deployment_status.state == 'success')
    # The production build is pushed to the gh-pages branch of this repo.
    permissions:
      contents: write

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          echo "TEST PROD URL" ${{ vars.PRODUCTION_URL }}

      # GitHub supplies GITHUB_TOKEN for each run. The job's contents: write
      # permission lets npm run deploy:production push to this repository.
      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Use the authenticated origin for the Pages push.
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # PRODUCTION_URL is a repository Actions variable under Settings →
      # Secrets and variables → Actions → Variables. It holds the public
      # Scalingo API origin. Vite embeds it as VITE_API_URL in the Pages build.
      # VITE_BASE_PATH is the /benefit-app/ path on the production Pages site.
      - name: Deploy FE to GitHub Pages production environment
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_URL }}
          VITE_BASE_PATH: /benefit-app/
        run: |
          cd frontend
          npm run deploy:production
