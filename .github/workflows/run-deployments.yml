name: Run deployments

on:
  deployment_status:

jobs:
  deploy-backend-to-production-environment:
    name: Deploy BE to production environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'fisma-benefit-app' &&
      github.event.deployment_status.state == 'success'

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Echo Heroku automatic deployment
        run: echo "Backend is deployed automatically in Heroku"

  deploy-frontend-to-production-environment:
    name: Deploy FE to production environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'fisma-benefit-app' &&
      github.event.deployment_status.state == 'success'
    permissions:
      contents: write

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Set the remote URL with authentication token
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Deploy FE to GitHub Pages production environment
        env:
          VITE_API_URL: ${{ secrets.HEROKU_PRODUCTION_URL }}
          VITE_BASE_PATH: /benefit-app/
        run: |
          cd frontend
          npm run deploy:production

  deploy-backend-to-testing-environment:
    name: Deploy BE to testing environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'fisma-benefit-app-testing' &&
      github.event.deployment_status.state == 'success'

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Echo Heroku automatic deployment
        run: echo "Backend is deployed automatically in Heroku"

  deploy-frontend-to-testing-environment:
    name: Deploy FE to testing environment
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.environment == 'fisma-benefit-app-testing' &&
      github.event.deployment_status.state == 'success'
    permissions:
      contents: read

    steps:
      - name: Debug Event Info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Environment: ${{ github.event.deployment_status.environment }}"
          echo "State: ${{ github.event.deployment_status.state }}"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # The testing frontends live in their own GitHub Pages site, the repo
      # fisma-benefit-app-testing/benefit-app-testing. The workflow pushes there with that repo's
      # deploy key (its private half is this repo's TESTING_PAGES_DEPLOY_KEY secret).
      - name: Load the testing Pages deploy key
        env:
          DEPLOY_KEY: ${{ secrets.TESTING_PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          # A key pasted into the secret in a browser can get Windows line endings, which
          # OpenSSH rejects ("error in libcrypto"), so strip them.
          echo "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "Error: TESTING_PAGES_DEPLOY_KEY is not a valid private key. Paste the whole private key file into the secret, including the BEGIN and END lines."
            exit 1
          fi
          # Compare with the fingerprint of the deploy key in the testing repo's Settings -> Deploy keys.
          ssh-keygen -l -f ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy FE to the testing GitHub Pages site
        env:
          VITE_API_URL: ${{ secrets.HEROKU_TESTING_URL }}
          VITE_BASE_PATH: /benefit-app-testing/testing/
        run: |
          cd frontend
          npm run deploy:testing
