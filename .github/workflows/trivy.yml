name: Trivy dependency scan

on:
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/trivy.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/trivy.yml
  schedule:
    - cron: "35 19 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    name: Scan ${{ matrix.component }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        if: matrix.component == 'backend'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build backend JAR
        if: matrix.component == 'backend'
        working-directory: backend
        run: ./gradlew clean bootJar

      - name: Record scan provenance
        env:
          COMPONENT: ${{ matrix.component }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p reports
          {
            date -u +"Scan preparation: %Y-%m-%dT%H:%M:%SZ"
            printf 'PR head: %s\n' "$PR_HEAD_SHA"
            printf 'Checked-out revision: '
            git rev-parse HEAD
            printf 'Component: %s\n' "$COMPONENT"
            if [ "$COMPONENT" = backend ]; then
              sha256sum backend/build/libs/*.jar
            else
              sha256sum frontend/package-lock.json
            fi
          } > reports/provenance.txt

      # Include npm build dependencies; report vulnerabilities without a severity gate.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        env:
          TRIVY_INCLUDE_DEV_DEPS: ${{ matrix.component == 'frontend' }}
        with:
          version: v0.76.1
          scan-type: ${{ matrix.component == 'backend' && 'rootfs' || 'fs' }}
          scan-ref: ${{ matrix.component == 'backend' && 'backend/build/libs' || 'frontend/package-lock.json' }}
          scanners: vuln
          list-all-pkgs: "true"
          format: json
          output: reports/trivy.json
          exit-code: "0"
          ignore-unfixed: "false"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          timeout: 10m
          cache: "false"

      - name: Produce readable report and summary
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          trivy --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --version >> reports/provenance.txt
          trivy convert --format table --output reports/trivy.txt reports/trivy.json
          trivy convert --format sarif --severity HIGH,CRITICAL --output reports/trivy.sarif reports/trivy.json
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          import os

          with open("reports/trivy.json") as report:
              data = json.load(report)
          expected_type = {"backend": "jar", "frontend": "npm"}[os.environ["COMPONENT"]]
          if not any(result.get("Type") == expected_type and result.get("Packages")
                     for result in data.get("Results", [])):
              raise SystemExit(f"No {expected_type} packages found in the scan")

          component = os.environ["COMPONENT"]
          source = {"backend": "backend/build.gradle", "frontend": "frontend/package-lock.json"}[component]
          with open("reports/trivy.sarif") as report:
              sarif = json.load(report)
          for run in sarif["runs"]:
              run.pop("originalUriBaseIds", None)
              for result in run.get("results", []):
                  message = result["message"]["text"]
                  package = next((line.removeprefix("Package: ") for line in message.splitlines()
                                  if line.startswith("Package: ")), None)
                  if not package or not result.get("ruleId"):
                      raise SystemExit("Cannot identify package and advisory in SARIF result")
                  identity = f"{component}\0{package}\0{result['ruleId']}"
                  result.setdefault("partialFingerprints", {})["primaryLocationLineHash"] = (
                      hashlib.sha256(identity.encode()).hexdigest() + ":1"
                  )
                  if not result.get("locations"):
                      raise SystemExit("SARIF result has no location")
                  for location in result.get("locations", []):
                      physical = location["physicalLocation"]
                      physical["artifactLocation"] = {"uri": source}
                      physical["region"] = {"startLine": 1}
          with open("reports/trivy.sarif", "w") as report:
              json.dump(sarif, report)

          counts = collections.Counter(
              vulnerability["Severity"]
              for result in data.get("Results", [])
              for vulnerability in result.get("Vulnerabilities", [])
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Trivy: {os.environ['COMPONENT']}\n\n")
              summary.write("Package/advisory occurrences, not confirmed exploitable findings or proof of deployed versions.\n\n")
              for severity in ("CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"):
                  summary.write(f"- {severity}: {counts[severity]}\n")
              summary.write("\nSee report artifacts for packages, fixes, and provenance.\n")
          PY

      # Fork and Dependabot runs still save reports without requiring a write token.
      - name: Publish high and critical findings to GitHub Security
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: reports/trivy.sarif
          category: trivy-${{ matrix.component }}

      - name: Save scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-${{ matrix.component }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
