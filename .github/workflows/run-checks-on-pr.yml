name: Run Checks on PR

on:
  pull_request:
  # PR runs can only restore caches saved on their own PR or on main, so
  # running on main keeps the Gradle/npm caches warm for new PRs.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-fe-formatting-check:
    name: Run FE formatting check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Prettier check
        run: |
          cd frontend
          npx prettier --check .

  run-fe-linting-check:
    name: Run FE linting check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint . --max-warnings 0

  run-fe-type-check:
    name: Run FE type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # tsc -b, not tsc --noEmit: the root tsconfig.json only references
      # tsconfig.app.json and tsconfig.node.json, which plain tsc doesn't follow.
      - name: Run TypeScript check
        run: |
          cd frontend
          npx tsc -b

  run-backend-tests:
    # Spotless runs here rather than in its own job: both jobs share one
    # setup-java cache key, and the faster Spotless job would save a cache
    # without the Spring dependencies.
    name: Run BE formatting check and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=2s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant Gradle execute permissions
        run: |
          cd backend
          chmod +x ./gradlew

      - name: Run Spotless check and backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          cd backend
          ./gradlew spotlessCheck test --continue
