name: Deploy Scalingo testing frontend

# The Scalingo backend is deployed by Scalingo's own GitHub auto-deploy (branch `main`) and does
# not report to run-deployments.yml, so the matching frontend is deployed here on every merge to
# `main`. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend-to-scalingo-testing-environment:
    name: Deploy FE to Scalingo testing environment
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # The testing frontends live in their own GitHub Pages site, the repo
      # fisma-benefit-app-testing/benefit-app-testing. The workflow pushes there with that repo's
      # deploy key (its private half is this repo's TESTING_PAGES_DEPLOY_KEY secret).
      - name: Load the testing Pages deploy key
        env:
          DEPLOY_KEY: ${{ secrets.TESTING_PAGES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          # A key pasted into the secret in a browser can get Windows line endings, which
          # OpenSSH rejects ("error in libcrypto"), so strip them.
          echo "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null; then
            echo "Error: TESTING_PAGES_DEPLOY_KEY is not a valid private key. Paste the whole private key file into the secret, including the BEGIN and END lines."
            exit 1
          fi
          # Compare with the fingerprint of the deploy key in the testing repo's Settings -> Deploy keys.
          ssh-keygen -l -f ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # Heroku's testing deployment pushes to the same gh-pages branch in the testing repo, and
      # both can run right after a merge. A push that loses the race is rejected, so retry a few
      # times.
      - name: Deploy FE to the testing GitHub Pages site
        env:
          VITE_API_URL: ${{ secrets.SCALINGO_TESTING_URL }}
          VITE_BASE_PATH: /benefit-app-testing/scalingo-testing/
        run: |
          cd frontend
          for attempt in 1 2 3; do
            if npm run deploy:scalingo-testing; then
              exit 0
            fi
            echo "Deployment attempt $attempt failed, retrying in 30 seconds..."
            sleep 30
          done
          echo "Error: could not deploy the Scalingo testing frontend after 3 attempts."
          exit 1

  e2e-tests:
    name: Run E2E tests against Scalingo testing environment
    needs: deploy-frontend-to-scalingo-testing-environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: playwright/package-lock.json

      # GitHub Pages publishes a minute or so after the push, and write-version.mjs puts this
      # run's commit SHA into version.json, so wait until the new build is what's served.
      - name: Wait for the deployed frontend
        env:
          SCALINGO_E2E_BASE_URL: ${{ secrets.SCALINGO_E2E_BASE_URL }}
        run: |
          for attempt in $(seq 30); do
            sha=$(curl -sf -m 10 "${SCALINGO_E2E_BASE_URL}version.json?cb=$(date +%s)" | jq -r '.sha' || true)
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "Frontend serves $sha"
              exit 0
            fi
            echo "Frontend serves '${sha:-nothing}', waiting for $GITHUB_SHA (attempt $attempt)..."
            sleep 10
          done
          echo "Frontend did not publish $GITHUB_SHA in time"
          exit 1

      - name: Install dependencies
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playwright
        env:
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          SCALINGO_E2E_TEST_USERNAME: ${{ secrets.SCALINGO_E2E_TEST_USERNAME }}
          SCALINGO_E2E_TEST_PASSWORD: ${{ secrets.SCALINGO_E2E_TEST_PASSWORD }}
        run: npx playwright test tests/login.spec.ts --project=chromium --reporter=list