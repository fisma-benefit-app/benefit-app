name: Deploy Scalingo testing frontend

# The Scalingo backend is deployed by Scalingo's own GitHub auto-deploy (branch `main`) and does
# not report to run-deployments.yml, so the matching frontend is deployed here on every merge to
# `main`. It can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend-to-scalingo-testing-environment:
    name: Deploy FE to Scalingo testing environment
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Configure Git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Set the remote URL with authentication token
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      # Heroku's testing deployment also pushes to the gh-pages branch, and both can run right
      # after a merge. A push that loses the race is rejected, so retry a few times.
      - name: Deploy FE to GitHub Pages Scalingo testing environment
        env:
          VITE_API_URL: ${{ secrets.SCALINGO_TESTING_URL }}
          VITE_BASE_PATH: /benefit-app/scalingo-testing/
        run: |
          cd frontend
          for attempt in 1 2 3; do
            if npm run deploy:scalingo-testing; then
              exit 0
            fi
            echo "Deployment attempt $attempt failed, retrying in 30 seconds..."
            sleep 30
          done
          echo "Error: could not deploy the Scalingo testing frontend after 3 attempts."
          exit 1
