openapi: 3.1.0
info:
  title: Project API
  description: |-
    API reference for Benefit.

    Sign in with `POST /token`, using Basic credentials and `X-Benefit-Login: 1`. Use the returned JWT as `Authorization: Bearer <token>` on subsequent requests. See the [authentication guide](../guides/authentication.md) for session renewal, expiration, and logout.

    Project owners can edit the latest version and manage access. Added project members have view-only access to project data.
  version: 1.0.2
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Project Management
  description: Endpoints for managing projects
- name: Session Management
  description: Endpoints for validating and revoking sessions
- name: User Management
  description: Endpoints for managing user accounts
- name: Functional Components
  description: Endpoints for managing functional components within projects
- name: Token Generation
  description: Endpoint for generating token
- name: Comment Management
  description: Endpoints for managing project comments
paths:
  /projects/{projectId}/comments/{commentId}:
    put:
      tags:
      - Comment Management
      summary: Update a project comment
      description: Updates an existing comment for the specified project
      operationId: updateComment
      parameters:
      - name: projectId
        in: path
        description: ID of the project
        required: true
        schema:
          type: integer
          format: int64
      - name: commentId
        in: path
        description: ID of the comment to update
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "200":
          description: Comment updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "404":
          description: Comment or project not found
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid comment data
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Comment does not belong to this project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
    delete:
      tags:
      - Comment Management
      summary: Delete a project comment
      description: Deletes a comment belonging to the specified project
      operationId: deleteComment
      parameters:
      - name: projectId
        in: path
        description: ID of the project
        required: true
        schema:
          type: integer
          format: int64
      - name: commentId
        in: path
        description: ID of the comment to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Comment deleted successfully
        "404":
          description: Comment or project not found
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Comment does not belong to this project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /projects/{id}:
    get:
      tags:
      - Project Management
      summary: Get a project by ID
      description: Retrieves a specific project if the authenticated user owns it
      operationId: getProject
      parameters:
      - name: id
        in: path
        description: ID of the project to retrieve
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Project found and returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: User does not have access to this project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
    put:
      tags:
      - Project Management
      summary: Update a project
      description: "Updates an existing project if the authenticated user owns it.\
        \ Only the latest version can be updated, the request must carry the lockNumber\
        \ it is based on, and neither the version number nor the project's users can\
        \ be changed"
      operationId: updateProject
      parameters:
      - name: id
        in: path
        description: ID of the project to update
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
        required: true
      responses:
        "200":
          description: Project updated successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid project data
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: "Not the latest version, or the project changed since lockNumber\
            \ was read"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "403":
          description: User does not have permission to update this project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
    delete:
      tags:
      - Project Management
      summary: Delete a project
      description: Soft deletes a project if the authenticated user owns it
      operationId: deleteProject
      parameters:
      - name: id
        in: path
        description: ID of the project to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Project deleted successfully
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: User does not have permission to delete this project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /appusers/password:
    put:
      tags:
      - User Management
      summary: Change user password
      description: "Changes the authenticated user's password after verifying currentPassword.\
        \ Success invalidates all existing sessions, including the current session;\
        \ sign in again"
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
        required: true
      responses:
        "403":
          description: Current password is incorrect
          content:
            text/plain:
              schema:
                type: string
        "200":
          description: Password changed successfully
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Invalid password format
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: User not authenticated
      security:
      - bearerAuth: []
  /token:
    post:
      tags:
      - Token Generation
      summary: Generate a JWT
      description: "Generates a signed JWT. Login requires Basic credentials and X-Benefit-Login:\
        \ 1. The rememberMe parameter picks a 30-day instead of a 24-hour token. With\
        \ a Bearer token this renews the session: the new token keeps the current\
        \ token's lifetime (rememberMe is ignored), the current token is revoked,\
        \ and a login can't be renewed past 30 days."
      operationId: getToken
      parameters:
      - name: X-Benefit-Login
        in: header
        description: Required with value 1 for Basic login; not required for Bearer
          renewal
        schema:
          type: string
          enum:
          - "1"
      - name: rememberMe
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: Token generated successfully
          headers:
            Authorization:
              description: "Bearer token, also returned in the response body"
              style: simple
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "User not authenticated, or the session can no longer be renewed"
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Missing Basic login header or origin rejected
        "429":
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Failed to encode the token
      security:
      - basicAuth: []
      - bearerAuth: []
  /projects:
    get:
      tags:
      - Project Management
      summary: Get all projects
      description: Retrieves all projects accessible to the authenticated user
      operationId: getAllProjects
      responses:
        "200":
          description: List of projects returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Project Management
      summary: Create a new project
      description: Creates a new project for the authenticated user
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
        required: true
      responses:
        "201":
          description: Project created successfully
        "400":
          description: Invalid project data
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: A project with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
      security:
      - bearerAuth: []
  /projects/{projectId}/comments:
    get:
      tags:
      - Comment Management
      summary: Get comments for a project
      description: Retrieves all comments for the specified project that the user
        can access
      operationId: getComments
      parameters:
      - name: projectId
        in: path
        description: ID of the project
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Comments returned successfully
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentResponse"
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
    post:
      tags:
      - Comment Management
      summary: Create a comment for a project
      description: Creates a new comment for the specified project
      operationId: createComment
      parameters:
      - name: projectId
        in: path
        description: ID of the project
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "201":
          description: Comment created successfully
        "400":
          description: Invalid comment data
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /projects/{id}/versions:
    post:
      tags:
      - Project Management
      summary: Create a new version of a project
      description: Creates a new version of an existing project if the authenticated
        user owns it
      operationId: createProjectVersion
      parameters:
      - name: id
        in: path
        description: ID of the project to version
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
        required: true
      responses:
        "201":
          description: Project version created successfully
        "404":
          description: Original project not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: Original project is not the latest version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "403":
          description: User does not have permission
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid project data
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /projects/{id}/users:
    post:
      tags:
      - Project Management
      summary: Add a user to a project
      description: Gives another user view-only access to the project and all of its
        versions. The authenticated user must be an owner
      operationId: addUserToProject
      parameters:
      - name: id
        in: path
        description: ID of the project to share
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRequest"
        required: true
      responses:
        "200":
          description: User added; the updated project is returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid username
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Project or user not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: User is already a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "403":
          description: User is not an owner of the project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /projects/{id}/duplicate:
    post:
      tags:
      - Project Management
      summary: Duplicate a project
      description: "Copies a project owned by the authenticated user and its active\
        \ components into a new project at version 1, with a unique name and the authenticated\
        \ user as its only member"
      operationId: duplicateProject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Duplicated project returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          description: Project not found
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: User is not an owner of the project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /functional-components/projects/{projectId}:
    post:
      tags:
      - Functional Components
      summary: Create a new functional component
      description: Creates a new functional component in the specified project. Requires
        an owner and the latest project version
      operationId: createFunctionalComponent
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FunctionalComponentRequest"
        required: true
      responses:
        "200":
          description: Functional component created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400":
          description: Invalid request data
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
        "403":
          description: User is not an owner of the project
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: "Project is not the latest version, or changed during the request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "404":
          description: Project or parent component not found
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /auth/logout:
    post:
      tags:
      - Session Management
      summary: Logout and revoke JWT
      description: "Revokes the current JWT by adding it to the blacklist. Clients\
        \ must send the JWT in the Authorization header as 'Bearer <token>'. After\
        \ logout, the token cannot be used for further requests."
      operationId: logout
      responses:
        "204":
          description: "Logout successful, token revoked"
        "401":
          description: "Invalid, expired or blacklisted JWT"
      security:
      - bearerAuth: []
  /appusers:
    post:
      tags:
      - User Management
      summary: Create a new app user
      description: Creates a user account. Only administrators can create accounts
      operationId: createNewUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUserRequest"
        required: true
      responses:
        "201":
          description: User created successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppUserSummary"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "403":
          description: User is not an admin
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid account data
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /auth/validateJWT:
    get:
      tags:
      - Session Management
      summary: Validate JWT
      description: Checks that the Bearer token belongs to an active session
      operationId: validate
      responses:
        "200":
          description: Token is valid
        "401":
          description: "Token is invalid, expired, or revoked"
      security:
      - bearerAuth: []
  /appusers/{id}:
    get:
      tags:
      - User Management
      summary: Get user by ID
      description: Retrieves the authenticated user's own details; another user's
        ID is rejected with 403
      operationId: getByUserId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: User found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppUserSummary"
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Users can only view their own details
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
    delete:
      tags:
      - User Management
      summary: Delete user account
      description: Soft deletes the authenticated user's account and invalidates its
        sessions
      operationId: deleteAppUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Account deleted successfully
        "401":
          description: User not authenticated
        "403":
          description: Users can only delete their own account
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: User not found
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /projects/{id}/users/{appUserId}:
    delete:
      tags:
      - Project Management
      summary: Remove a user from a project
      description: Removes a user's access to the project and all of its versions.
        The authenticated user must be an owner. The project is kept for the remaining
        members
      operationId: removeUserFromProject
      parameters:
      - name: id
        in: path
        description: ID of the project
        required: true
        schema:
          type: integer
          format: int64
      - name: appUserId
        in: path
        description: ID of the user to remove
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: User removed
        "404":
          description: "Project not found, or user is not a member"
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: The user is the last member; delete the project instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
        "403":
          description: User is not an owner of the project
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /functional-components/{componentId}/projects/{projectId}:
    delete:
      tags:
      - Functional Components
      summary: Delete a functional component
      description: Soft deletes a functional component from the specified project.
        Requires an owner and the latest project version
      operationId: deleteFunctionalComponent
      parameters:
      - name: componentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Functional component deleted successfully
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Unauthorized
        "403":
          description: User is not an owner of the project
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Component or project not found
          content:
            text/plain:
              schema:
                type: string
        "409":
          description: "Project is not the latest version, or changed during the request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    CommentRequest:
      type: object
      description: Request object for creating or updating a project comment
      properties:
        text:
          type: string
          description: Comment text
          example: This requirement still needs validation
          maxLength: 2000
          minLength: 0
      required:
      - text
    CommentResponse:
      type: object
      description: Response object containing a comment tied to a project version
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the comment
          example: 1
        text:
          type: string
          description: Comment text
          example: The validation needs review
        projectId:
          type: integer
          format: int64
          description: ID of the project version this comment belongs to
          example: 7
    FunctionalComponentRequest:
      type: object
      description: Request object for creating or updating functional components within
        a project
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
          example: 1
        title:
          type: string
          description: Title of the functional component
          example: Create User Account
          maxLength: 255
          minLength: 0
        description:
          type: string
          description: Detailed description of the functional component
          example: Handles user account creation process
          maxLength: 10000
          minLength: 0
        className:
          type: string
          description: Name of the class
          example: UserAccount
          maxLength: 255
          minLength: 0
        componentType:
          type: string
          description: Type of the functional component
        dataElements:
          type: integer
          format: int32
          description: Number of data elements
          example: 5
          minimum: 0
        readingReferences:
          type: integer
          format: int32
          description: Number of reading references
          example: 2
          minimum: 0
        writingReferences:
          type: integer
          format: int32
          description: Number of writing references
          example: 1
          minimum: 0
        functionalMultiplier:
          type: integer
          format: int32
          description: Multiplier for functional points calculation
          example: 3
          minimum: 1
        operations:
          type: integer
          format: int32
          description: Number of operations
          example: 4
          minimum: 0
        degreeOfCompletion:
          type: number
          format: double
          description: Completion status (0.0 to 1.0)
          example: 0.75
          maximum: 1.0
          minimum: 0.0
        previousFCId:
          type: integer
          format: int64
          description: "ID of this component's counterpart in the previous project\
            \ version, used to diff versions in the PDF report and to carry over parent/subcomponent\
            \ links when a new version is created. Not related to ordering; null if\
            \ the component has no prior version."
          example: 123
        orderPosition:
          type: integer
          format: int32
          description: Position in the component list
          example: 1
          minimum: 0
        isMLA:
          type: boolean
          description: Indicates if the functional component participates in multi-layer
            architecture (MLA) as either a parent or child component. 'true' means
            the component is part of MLA hierarchy.
          example: true
        parentFCId:
          type: integer
          format: int64
          description: "ID of the parent functional component, if part of multi-layer\
            \ architecture"
          example: 12
        subComponents:
          type: array
          description: List of sub-components if part of multi-layer architecture
          items:
            $ref: "#/components/schemas/FunctionalComponentRequest"
        subComponentType:
          type: string
          description: Type of sub-component in multi-layer architecture
          enum:
          - presentation
          - businessLogic
          - dataAccess
          - integration
          example: presentation
        isReadonly:
          type: boolean
          description: Indicates if component is readonly
          example: true
      required:
      - isMLA
      - isReadonly
      - orderPosition
    ProjectRequest:
      type: object
      description: Request object for creating or updating a project
      properties:
        projectName:
          type: string
          description: Name of the project
          example: User Authentication System
          maxLength: 255
          minLength: 0
        version:
          type: integer
          format: int32
          description: Version of the project
          example: 1
          minimum: 0
        functionalComponents:
          type: array
          description: List of functional components in the project
          items:
            $ref: "#/components/schemas/FunctionalComponentRequest"
          uniqueItems: true
        calculationDate:
          type: string
          format: date
          description: Calculation date of the project
          example: 2026-04-08
        reportContactDetails:
          type: string
          description: Optional contact details printed on the report
          maxLength: 2000
          minLength: 0
        reportNotes:
          type: string
          description: Optional calculation notes printed on the report
          maxLength: 5000
          minLength: 0
        lockNumber:
          type: integer
          format: int64
          description: The project's lockNumber from the response the edit is based
            on. Required when updating a project; the update is rejected with 409
            if the project has changed since.
          example: 3
      required:
      - projectName
      - version
    ConflictResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    AppUserSummary:
      type: object
      description: Summary information about an application user
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the user
          example: 1
        username:
          type: string
          description: Username of the user
          example: john.doe
          maxLength: 50
    FunctionalComponentResponse:
      type: object
      description: Response object containing details on functional components within
        a project
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier
          example: 1
        title:
          type: string
          description: Title of the functional component
          example: Create User Account
        description:
          type: string
          description: Detailed description of the functional component
        className:
          type: string
          description: Name of the class
          example: UserAccount
        componentType:
          type: string
          description: Type of the functional component
        dataElements:
          type: integer
          format: int32
          description: Number of data elements
          example: 5
          minimum: 0
        readingReferences:
          type: integer
          format: int32
          description: Number of reading references
          example: 2
          minimum: 0
        writingReferences:
          type: integer
          format: int32
          description: Number of writing references
          example: 1
          minimum: 0
        functionalMultiplier:
          type: integer
          format: int32
          description: Multiplier for functional points calculation
          example: 3
          minimum: 1
        operations:
          type: integer
          format: int32
          description: Number of operations
          example: 4
          minimum: 0
        degreeOfCompletion:
          type: number
          format: double
          description: Completion status (0.0 to 1.0)
          example: 0.75
          maximum: 1
          minimum: 0
        previousFCId:
          type: integer
          format: int64
          description: "ID of this component's counterpart in the previous project\
            \ version, used to diff versions in the PDF report and to carry over parent/subcomponent\
            \ links when a new version is created. Not related to ordering; null if\
            \ the component has no prior version."
          example: 123
        orderPosition:
          type: integer
          format: int32
          description: Position in the component list
          example: 1
          minimum: 0
        isMLA:
          type: boolean
          description: Whether the functional component is part of multi-layer architecture
            (MLA)
          example: true
        parentFCId:
          type: integer
          format: int64
          description: "ID of the parent functional component, if part of multi-layer\
            \ architecture (MLA)"
          example: 12
        subComponentType:
          type: string
          description: Type of sub-component in multi-layer architecture
          example: presentation
        isReadonly:
          type: boolean
          description: Indicates if this component is readonly (for sub-components)
          example: true
        subComponents:
          type: array
          description: List of sub-components for multi-layer architecture
          items:
            $ref: "#/components/schemas/FunctionalComponentResponse"
    ProjectAppUserResponse:
      type: object
      description: Response object containing project-user relationship details
      properties:
        id:
          type: integer
          format: int64
          description: ID of the project-user relationship
          example: 1
        roleInProject:
          type: string
          description: User's role in the project
          enum:
          - OWNER
          - MEMBER
          example: OWNER
        appUser:
          $ref: "#/components/schemas/AppUserSummary"
          description: AppUser details
    ProjectResponse:
      type: object
      description: Response object containing project details
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the project
          example: 1
        familyId:
          type: string
          format: uuid
          description: Immutable identifier shared by versions of this project
        projectName:
          type: string
          description: Name of the project
          example: User Authentication Service
        version:
          type: integer
          format: int32
          description: Version of the project
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: 2025-09-25T10:30:00
        versionCreatedAt:
          type: string
          format: date-time
          description: Last version update timestamp
          example: 2025-09-25T15:45:00
        calculationDate:
          type: string
          format: date
          description: Calculation date
          example: 2026-04-08
        reportContactDetails:
          type: string
          description: Optional contact details printed on the report
        reportNotes:
          type: string
          description: Optional calculation notes printed on the report
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: 2025-09-25T15:45:00
        lockNumber:
          type: integer
          format: int64
          description: Optimistic-lock counter. Send it back unchanged when updating
            the project; a stale value is rejected with 409
          example: 3
        active:
          type: boolean
          description: Whether the project is active
        functionalComponents:
          type: array
          description: Functional components in the project
          items:
            $ref: "#/components/schemas/FunctionalComponentResponse"
          uniqueItems: true
        projectAppUsers:
          type: array
          description: Users associated with the project
          items:
            $ref: "#/components/schemas/ProjectAppUserResponse"
          uniqueItems: true
    PasswordChangeRequest:
      type: object
      description: Request object containing details on password change
      properties:
        currentPassword:
          type: string
          description: Current account password
          maxLength: 72
          minLength: 0
          writeOnly: true
        newPassword:
          type: string
          description: Nonblank replacement password containing 8 to 72 Unicode code
            points and at most 72 UTF-8 bytes. Null characters and line breaks are
            not allowed.
          writeOnly: true
      required:
      - currentPassword
      - newPassword
    TokenResponse:
      type: object
      description: Response object containing JWT token details
      properties:
        token:
          type: string
          description: The JWT token issued to the authenticated user
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          description: "Type of token, usually 'Bearer'"
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Time in seconds until the token expires
          example: 2592000
    ProjectMemberRequest:
      type: object
      description: Request object for adding a user to a project
      properties:
        username:
          type: string
          description: Username of the user to add
          example: john.doe
          maxLength: 50
          minLength: 0
      required:
      - username
    AppUserRequest:
      type: object
      description: Request object for creating app users
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          description: Nonblank password containing 8 to 72 Unicode code points and at most 72 UTF-8 bytes. Null characters and line breaks are not allowed.
          writeOnly: true
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - password
      - role
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
