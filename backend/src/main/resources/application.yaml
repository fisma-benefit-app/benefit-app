spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fisma_db}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}

  # DO NOT CHANGE THIS. If you need to change the database initialization mode, do so in application-dev.yaml. This is set to never to prevent accidental database seeding in production.
  # For dev-profile, it is set to always in application-dev.yaml to allow for database seeding.
  sql:
    init:
      mode: never # DO NOT CHANGE

jwt:
  private.key: ${JWT_PRIVATE_KEY}
  public.key: classpath:./jwt-keys/app.pub

# Browser origins allowed to call the API: comma-separated scheme://host[:port], no path.
# Set CORS_ALLOWED_ORIGINS when the frontend is served from anywhere else (e.g. a self-hosted server).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://fisma-benefit-app.github.io,http://localhost:5173}

server:
  error:
    include-message: ${API_DEBUG:never}
    include-stacktrace: ${API_DEBUG:never}
    include-exception: false
    include-binding-errors: ${API_DEBUG:never}

logging:
  level:
    org.springframework.security: ${API_DEBUG_LEVEL:info}
    org.springframework.security.web: ${API_DEBUG_LEVEL:info}
    org.springframework.security.oauth2: ${API_DEBUG_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        include: health, info
